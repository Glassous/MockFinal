# ============================================================
# docker-compose.pageref.yml · PageRef Builder / Validator 容器编排 overlay
#
# 状态：P2 已实现，镜像包含 dist/server.js；真实 Pi 模式需配置 LLM 凭据，
# 未配置时 Builder 会拒绝 pi 模式（可用 PAGE_BUILDER_MOCK=1 联调）。
#
# 用法（在仓库根目录执行）：
#   docker compose -f docker-compose.yml -f docker-compose.pageref.yml up -d
#
# 前置条件：根目录 .env 中设置 BUILDER_TOKEN、VALIDATOR_TOKEN、
# LLM_BASE_URL、LLM_API_KEY、PAGE_BUILDER_MODEL；不要使用文档里的 change-me。
#
# 边界说明：
# - 本 overlay 不修改现有 db / api 服务，也不映射任何宿主端口；
# - 主 api 需接入 pageref_internal 网络后才能访问 Builder/Validator；
# - HMAC 已绑定 method/path/body，主 API 与 Builder 必须同版本部署；
# - 只读根文件系统、tmpfs、cap_drop、no-new-privileges 与资源限制在此提供；
# - 不在容器内写入密钥，全部通过环境变量注入。
# ============================================================
services:
  page-validator:
    build:
      # 构建上下文为仓库根目录：镜像同时需要 validator/ 与 shared/（共享 runtime 与 shell）
      context: .
      dockerfile: validator/Dockerfile
    container_name: mockfinal-page-validator
    environment:
      VALIDATOR_TOKEN: ${VALIDATOR_TOKEN:?请在根目录 .env 设置 VALIDATOR_TOKEN}
    expose:
      # 仅容器内部端口，不映射到宿主
      - "9200"
    networks:
      - pageref_internal
    read_only: true
    tmpfs:
      # Chromium 与 Node 的临时文件；只读根文件系统下必须可写
      - /tmp:size=1g,mode=1777
    # Chromium 需要足够的共享内存，避免默认 64MB 导致渲染崩溃
    shm_size: "512mb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    init: true
    restart: unless-stopped

  page-builder:
    build:
      context: ./builder
    container_name: mockfinal-page-builder
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:?请在根目录 .env 设置 LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:?请在根目录 .env 设置 LLM_API_KEY}
      PAGE_BUILDER_MODEL: ${PAGE_BUILDER_MODEL:?请在根目录 .env 设置 PAGE_BUILDER_MODEL}
      PAGE_VALIDATOR_URL: http://page-validator:9200
      PAGE_VALIDATOR_TOKEN: ${VALIDATOR_TOKEN:?请在根目录 .env 设置 VALIDATOR_TOKEN}
      BUILDER_TOKEN: ${BUILDER_TOKEN:?请在根目录 .env 设置 BUILDER_TOKEN}
      PI_CODING_AGENT_DIR: /opt/mockfinal-pi/agent
    expose:
      # 仅容器内部端口，不映射到宿主
      - "9100"
    networks:
      # 内部网络用于访问 Validator 与主 API 回调；egress 网络仅用于访问 LLM 网关
      - pageref_internal
      - pageref_egress
    depends_on:
      - page-validator
    read_only: true
    tmpfs:
      # /tmp 放会话级临时文件，/tmp/builds 放每次构建的隔离工作目录
      - /tmp:size=128m,mode=1777
      - /tmp/builds:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    init: true
    restart: unless-stopped

networks:
  # 主 API、Builder、Validator 之间的内部网络；不允许出网
  pageref_internal:
    internal: true
  # Builder 访问 LLM 网关的出网网络；Validator 不接入
  pageref_egress:
    driver: bridge
