<!-- 脚手架说明：以下 HTML 注释只用于讲解区块职责；页面契约不接受注释序列，提交前必须删除全部注释。 -->
<div class="mp-page" data-mp-state="idle">
  <!-- 头部：分类标签（可选）/ 唯一的 h1 / 一句话副标题。标题保持纯文本，不要塞 HTML。 -->
  <header class="mp-head">
    <p class="mp-eyebrow">章节 · 知识点分类</p>
    <h1 class="mp-title">页面主标题</h1>
    <p class="mp-sub">副标题：用一句话说清本页唯一的论点。</p>
  </header>

  <!-- 主体：左主视觉（.mp-stage）+ 右侧注（.mp-side）。主体必须 min-height: 0，否则撑破一屏。 -->
  <main class="mp-body">
    <section class="mp-stage" aria-label="主视觉与演示">
      <!-- 主视觉：内联 SVG / CSS 网格 / 数组方格；纯装饰容器对读屏隐藏。交互元素必须用 <button type="button">。 -->
      <div class="mp-visual" data-mp-role="visual" aria-hidden="true">
        <p class="mp-placeholder">在这里放一个与知识点相关的视觉元素，而不是装饰图。</p>
      </div>
      <!-- 状态区：屏幕阅读器朗读；每一步只更新这一行，不要整页替换。 -->
      <p class="mp-status" data-mp-role="status" aria-live="polite">初始状态：点「下一步」后这里会更新。</p>
    </section>

    <aside class="mp-side" aria-label="侧注与要点">
      <!-- 侧注 1：核心不变式 / 一句话结论。 -->
      <div class="mp-note">
        <p class="mp-label">核心不变式</p>
        <p class="mp-note-text">把 brief 的 key_points 压成一句话。</p>
      </div>
      <!-- 侧注 2：最多 3 条速查信息，用 dl 承载“标签 + 值”。 -->
      <dl class="mp-facts">
        <div class="mp-fact"><dt>前提</dt><dd>最多 3 条</dd></div>
        <div class="mp-fact"><dt>公式</dt><dd>用等宽字体，避免外部公式库</dd></div>
        <div class="mp-fact"><dt>复杂度</dt><dd>O(log n)</dd></div>
      </dl>
    </aside>
  </main>

  <!-- 底部：左侧来源（source_refs 摘要，不要外链），右侧操作区。一个页面只允许一个主按钮。 -->
  <footer class="mp-foot">
    <p class="mp-source">依据：资料 · 小节标题（section 000）</p>
    <div class="mp-controls">
      <button type="button" class="mp-btn mp-btn-primary" data-mp-action="step">下一步</button>
      <button type="button" class="mp-btn" data-mp-action="reset">重置</button>
    </div>
  </footer>
</div>
