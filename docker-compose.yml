services:
  db:
    image: pgvector/pgvector:pg17
    container_name: mockfinal-db
    ports:
      # 宿主 5432 已被本机原生 PostgreSQL 占用，映射到 5433；仅绑定回环地址，避免数据库对外暴露（#16）
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: mockfinal
      POSTGRES_USER: mockfinal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mockfinal}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockfinal -d mockfinal"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    restart: unless-stopped

  api:
    build: ./backend
    container_name: mockfinal-api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # 显式给默认值，避免 backend/.env 缺失该项时崩溃
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mockfinal:mockfinal@db:5432/mockfinal}
    volumes:
      # 未配置 OSS 时的本地回退存储目录
      - ./backend/data:/app/data
    mem_limit: 1.5g
    restart: unless-stopped

volumes:
  pgdata:
